<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Профессии и варианты обучения от ПрофНавигатора." />
  <title>Профессия — ПрофНавигатор</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>.page{width:min(880px,calc(100% - 40px));margin:0 auto;padding:48px 0 80px}.back{display:inline-block;color:#6657e8;font-weight:800;text-decoration:none;margin-bottom:42px}.career-card{background:#fff;border:1px solid #e7e8f1;border-radius:24px;padding:42px;box-shadow:0 12px 40px #49416b12}.career-card h1{font-size:clamp(34px,6vw,56px);letter-spacing:-2px;margin:8px 0 32px}.career-card h2{font-size:19px;letter-spacing:-.4px;margin:27px 0 9px}.career-card p{color:#65708a;line-height:1.7;margin:0}.career-card ul{margin:0;padding-left:21px;color:#65708a;line-height:1.8}.steps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:10px}.step{border:1px solid #e7e8f1;border-radius:14px;padding:17px}.step b{display:block;margin-bottom:7px}.step a{color:#6657e8;font-weight:800}@media(max-width:560px){.career-card{padding:26px 20px}.page{padding-top:28px}.steps-grid{grid-template-columns:1fr}}</style>
</head>
<body>
  <main class="page"><a class="back" href="index.html">← Вернуться к тесту</a><article class="career-card" id="career" aria-live="polite"></article></main>
  <script src="js/data.js?v=4"></script>
  <script>
    const name=new URLSearchParams(location.search).get('id'),detail=professionDetails[name],card=document.getElementById('career');
    const guides={
      tech:['Основы HTML, CSS, JavaScript и английский для IT.','Соберите простую страницу или мини-приложение.','freeCodeCamp: бесплатный курс программирования','https://www.freecodecamp.org/learn/'],
      design:['Основы композиции, цвета и работу в Figma.','Повторите дизайн любимого приложения в Figma.','OpenLearn: бесплатные курсы по искусству и дизайну','https://www.open.edu/openlearn/free-courses/full-catalogue'],
      business:['Маркетинг, основы экономики и работу с целевой аудиторией.','Придумайте продвижение для знакомого бренда.','OpenLearn: бесплатные курсы по бизнесу','https://www.open.edu/openlearn/free-courses/full-catalogue'],
      science:['Биологию, химию и научный метод.','Ведите дневник наблюдений или сделайте научный мини-проект.','Khan Academy: бесплатные уроки по естественным наукам','https://www.khanacademy.org/science'],
      people:['Психологию общения и основы педагогики.','Объясните сложную тему другу или проведите мини-урок.','OpenLearn: бесплатные курсы по образованию и психологии','https://www.open.edu/openlearn/free-courses/full-catalogue'],
      finance:['Математику, Excel и основы личных финансов.','Составьте бюджет на месяц и проанализируйте расходы.','Khan Academy: бесплатные курсы по экономике','https://www.khanacademy.org/economics-finance-domain'],
      law:['Основы права, обществознание и деловую коммуникацию.','Разберите простой договор или правила школьного проекта.','OpenLearn: бесплатные курсы по праву и обществу','https://www.open.edu/openlearn/free-courses/full-catalogue'],
      engineering:['Физику, черчение и основы работы механизмов.','Соберите простую модель или изучите CAD-моделирование.','OpenLearn: бесплатные курсы по науке и технике','https://www.open.edu/openlearn/free-courses/full-catalogue']
    };
    const area=Object.entries(areas).find(([,value])=>value.professions.includes(name)),guide=area?guides[area[0]]:null;
    if(!detail){card.innerHTML='<h1>Профессия не найдена</h1><p>Вернитесь к результатам теста и выберите профессию из списка.</p>'}else{document.title=`${name} — ПрофНавигатор`;card.innerHTML=`<p class="eyebrow">ПРОФЕССИЯ</p><h1>${name}</h1><h2>Чем занимается</h2><p>${detail[0]}</p><h2>Полезные школьные предметы</h2><p>${detail[1]}</p><h2>Ключевые навыки</h2><p>${detail[2]}</p><h2>Варианты обучения</h2><p>${detail[3]}</p><h2>Первые шаги</h2><div class="steps-grid"><div class="step"><b>Что изучить</b>${guide[0]}</div><div class="step"><b>Что попробовать</b>${guide[1]}</div><div class="step"><b>Бесплатный курс</b><a href="${guide[3]}" target="_blank" rel="noopener noreferrer">${guide[2]} →</a></div></div>`}
  </script>
</body>
</html>
