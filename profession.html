<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Профессии и варианты обучения от ПрофНавигатора." />
  <title>Профессия — ПрофНавигатор</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>.page{width:min(880px,calc(100% - 40px));margin:0 auto;padding:48px 0 80px}.back{display:inline-block;color:#6657e8;font-weight:800;text-decoration:none;margin-bottom:42px}.career-card{background:#fff;border:1px solid #e7e8f1;border-radius:24px;padding:42px;box-shadow:0 12px 40px #49416b12}.career-card h1{font-size:clamp(34px,6vw,56px);letter-spacing:-2px;margin:8px 0 32px}.career-card h2{font-size:19px;letter-spacing:-.4px;margin:27px 0 9px}.career-card p{color:#65708a;line-height:1.7;margin:0}.career-card ul{margin:0;padding-left:21px;color:#65708a;line-height:1.8}@media(max-width:560px){.career-card{padding:26px 20px}.page{padding-top:28px}}</style>
</head>
<body>
  <main class="page"><a class="back" href="index.html">← Вернуться к тесту</a><article class="career-card" id="career" aria-live="polite"></article></main>
  <script src="js/data.js?v=4"></script>
  <script>const name=new URLSearchParams(location.search).get('id'),detail=professionDetails[name],card=document.getElementById('career');if(!detail){card.innerHTML='<h1>Профессия не найдена</h1><p>Вернитесь к результатам теста и выберите профессию из списка.</p>'}else{document.title=`${name} — ПрофНавигатор`;card.innerHTML=`<p class="eyebrow">ПРОФЕССИЯ</p><h1>${name}</h1><h2>Чем занимается</h2><p>${detail[0]}</p><h2>Полезные школьные предметы</h2><p>${detail[1]}</p><h2>Ключевые навыки</h2><p>${detail[2]}</p><h2>Варианты обучения</h2><p>${detail[3]}</p>`}</script>
</body>
</html>
